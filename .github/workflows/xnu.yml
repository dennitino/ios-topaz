name: xnu

# Sonda temporária: que servidores Mac do GitHub ainda existem e que Xcode cada um tem.
on:
  workflow_dispatch:

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, macos-26, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Xcode
        run: |
          set +e
          sw_vers; uname -m
          echo "== apps"; ls -d /Applications/Xcode*.app
          echo "== padrão"; xcode-select -p; xcodebuild -version
          for x in /Applications/Xcode_*.app; do
            [ -L "$x" ] && { echo "== $x -> $(readlink "$x")"; continue; }
            echo "== $x"
            DEVELOPER_DIR="$x/Contents/Developer" xcodebuild -version | tr '\n' ' '; echo
            ls "$x/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/" | tr '\n' ' '; echo
            DEVELOPER_DIR="$x/Contents/Developer" xcrun -find iig
          done
          echo "== ferramentas"; which brew bash cmake ninja ccache jq 2>&1
